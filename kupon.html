<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Золотое Яблоко</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --lime: #C8FF00;
      --lime-dark: #B4E600;
      --black: #111111;
      --gray: #8A8A8A;
      --light-gray: #F5F5F5;
      --border: #EEEEEE;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 420px;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .logo {
      height: 28px;
      width: auto;
    }

    .logo-fallback {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .promo-card {
      width: 100%;
      background: var(--lime);
      border-radius: 20px;
      padding: 22px 20px;
      margin-bottom: 16px;
      color: var(--black);
    }

    .promo-card .discount {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.5px;
      color: var(--black);
    }

    .promo-card .discount span {
      font-size: 28px;
    }

    .promo-card .bonus {
      margin-top: 12px;
      font-size: 15px;
      font-weight: 500;
      color: var(--black);
    }

    .promo-card .bonus strong {
      font-size: 20px;
      font-weight: 700;
    }

    .pills {
      width: 100%;
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .pill {
      flex: 1;
      background: var(--light-gray);
      border: none;
      border-radius: 50px;
      padding: 12px 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .pill svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .section-title {
      width: 100%;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    .roulette-card {
      width: 100%;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px 0 18px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .roulette-label {
      text-align: center;
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 10px;
      font-weight: 500;
    }

    .roulette-viewport {
      height: 150px;
      overflow: hidden;
      position: relative;
      background: #FAFAFA;
    }

    .roulette-track {
      display: flex;
      height: 100%;
      will-change: transform;
    }

    .prize-item {
      min-width: 130px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
      border-right: 1px solid #F0F0F0;
      padding: 8px 4px;
    }

    .prize-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    .prize-name {
      font-size: 11px;
      text-align: center;
      color: var(--black);
      font-weight: 500;
      line-height: 1.25;
      max-width: 110px;
      white-space: pre-line;
    }

    .pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: var(--black);
      z-index: 5;
      pointer-events: none;
    }

    .pointer::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 9px solid var(--black);
    }

    .spin-btn {
      width: 100%;
      padding: 18px;
      background: var(--lime);
      color: var(--black);
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      margin-bottom: 20px;
    }

    .spin-btn:active:not(:disabled) {
      transform: scale(0.98);
      background: var(--lime-dark);
    }

    .spin-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .info-card {
      width: 100%;
      background: var(--light-gray);
      border-radius: 16px;
      padding: 16px;
    }

    .info-card h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .prizes-preview {
      width: 100%;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .prizes-preview::-webkit-scrollbar {
      display: none;
    }

    .preview-item {
      flex-shrink: 0;
      width: 88px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 6px;
      text-align: center;
    }

    .preview-item img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      margin-bottom: 4px;
    }

    .preview-item .name {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s;
      padding: 20px;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--white);
      border-radius: 24px;
      padding: 28px 22px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      transform: scale(0.92);
      transition: transform 0.25s;
    }

    .modal-overlay.show .modal {
      transform: scale(1);
    }

    .modal-bill {
      width: 100%;
      max-width: 200px;
      height: auto;
      margin: 18px auto 12px;
      display: block;
      border-radius: 4px;
      box-shadow: none;
      border: none;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 500;
      color: #8A8A8A;
      margin-bottom: 4px;
      letter-spacing: 0.2px;
    }

    .modal-prize {
      font-size: 26px;
      font-weight: 800;
      margin: 4px 0 6px;
      letter-spacing: -0.5px;
      color: #111;
    }

    .modal-sub {
      font-size: 13px;
      color: #8A8A8A;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .modal-btn {
      width: 100%;
      padding: 15px;
      background: var(--lime);
      color: var(--black);
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

    };

    const prizes = [
      { img: IMG.iphone, name: 'iPhone 17\nСиний' },
      { img: IMG.perfume, name: 'Духи\nZielinski' },
      { img: IMG.bill1000, name: 'Купон\n1 000 ₽' },
      { img: IMG.serum, name: 'Сыворотки\nHanbang' },
      { img: IMG.iphone, name: 'iPhone 17\nСиний' },
      { img: IMG.perfume, name: 'Духи\nPowder' },
      { img: IMG.bill1000, name: 'Купон\n2 000 ₽' },
      { img: IMG.serum, name: 'Набор\nухода' },
      { img: IMG.bill5000, name: 'Купон\n5 000 ₽' },
      { img: IMG.iphone, name: 'iPhone 17\nСиний' },
      { img: IMG.perfume, name: 'Духи\nZielinski' },
      { img: IMG.bill1000, name: 'Купон\n500 ₽' },
      { img: IMG.serum, name: 'Сыворотки\nHanbang' },
      { img: IMG.iphone, name: 'iPhone 17\nСиний' },
      { img: IMG.bill5000, name: 'Купон\n5 000 ₽' },
    ];

    const track = document.getElementById('rouletteTrack');
    const spinBtn = document.getElementById('spinBtn');
    const modal = document.getElementById('modal');
    const closeModal = document.getElementById('closeModal');

    function buildTrack() {
      track.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        prizes.forEach(p => {
          const item = document.createElement('div');
          item.className = 'prize-item';
          item.innerHTML = `
            <img class="prize-img" src="${p.img}" alt="">
            <div class="prize-name">${p.name}</div>
          `;
          track.appendChild(item);
        });
      }
    }
    buildTrack();

    let isSpinning = false;
    const itemWidth = 130;
    const targetIndex = 8; // купон 5000

    spinBtn.addEventListener('click', () => {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;
      spinBtn.textContent = 'Крутим...';

      track.style.transition = 'none';
      track.style.transform = 'translateX(0)';
      void track.offsetWidth;

      const fullRounds = 4;
      const totalItems = prizes.length * fullRounds + targetIndex;
      const viewportCenter = document.querySelector('.roulette-viewport').offsetWidth / 2;
      const finalOffset = -(totalItems * itemWidth - viewportCenter + itemWidth / 2);

      track.style.transition = 'transform 4.7s cubic-bezier(0.12, 0.8, 0.2, 1)';
      track.style.transform = `translateX(${finalOffset}px)`;

      setTimeout(() => {
        modal.classList.add('show');
        if (tg) tg.HapticFeedback?.notificationOccurred('success');
      }, 4800);
    });

    closeModal.addEventListener('click', () => {
      modal.classList.remove('show');
      isSpinning = false;
      spinBtn.disabled = false;
      spinBtn.textContent = 'Крутить рулетку';
    });

    document.querySelectorAll('.pill').forEach(el => {
      el.addEventListener('click', () => {
        if (tg) tg.HapticFeedback?.impactOccurred('light');
      });
    });
  </script>
